set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Deload config file
unbind r
bind r source-file ~/.tmux.conf

set -g mouse on

# Navigate panes
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-option -g status-position bottom

# Bind 'c' to open a new window in the same working directory as the current pane
bind c new-window -c "#{pane_current_path}"

# Bind 'C-d' to open a new window in dotfiles directory with nvim
bind C-d new-window -c "/Users/kad/dotfiles" \; send-keys "nvim" Enter

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-continuum: enable automatic restore
set -g @continuum-restore 'on'

# Color fix
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Status bar styling to match darkvoid theme
set -g status-bg '#191919' # Dark gray background (gray2)
set -g status-fg '#aaaaaa' # Light gray foreground (gray7)

# Status bar refresh cadence (PR badge is cached for 60s, so 10s is comfortable)
set -g status-interval 10

# status-right: PR badge for the current session, then the clock
set -g status-right '#[fg=#cba6f7,bg=#191919] #(/Users/kad/dotfiles/bin/ticket-pr-badge #S) #[fg=#66b2b2,bg=#191919]%H:%M '
set -g status-right-length 60

# Inactive window: subtle grays with low contrast
set -g window-status-format "#[fg=#555555, bg=#191919] #I #[fg=#aaaaaa, bg=#191919] #W "

# Active window: higher contrast using brighter foreground and darker background
set -g window-status-current-format "#[fg=#1bfd9c, bg=#2a2a2a] #I #[fg=#1bfd9c, bg=#2a2a2a] #W "

# status-left: session name + Linear title (if @ticket_title is set on the session)
set -g status-left '#[fg=#708090,bg=#191919] #S #[fg=#666666,bg=#191919]#{?@ticket_title,— #{@ticket_title} ,}#[default]'
set -g status-left-length 80

# Enable automatic window renaming based on the current running command
set -g automatic-rename on

# Add to your ~/.tmux.conf
bind g display-popup -E -w 80% -h 60% "recon"        # prefix + g → dashboard
bind N display-popup -E -w 80% -h 60% "recon new"    # prefix + N → new session
bind R display-popup -E -w 80% -h 60% "recon resume" # prefix + R → resume picker
bind i run-shell "recon next"                         # prefix + i → jump to next input agent
bind X confirm-before -p "Kill session #S? (y/n)" kill-session

# ticket.sh dashboard
unbind s
# TICKET_HOME_SESS tells ticket-rm which session this popup was opened from, so
# killing that session can move the client off it first (keeping the popup alive).
bind s display-popup -E -w 95% -h 85% "TICKET_HOME_SESS='#{session_name}' /Users/kad/dotfiles/bin/ticket-dashboard"  # prefix + s → ticket dashboard

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
